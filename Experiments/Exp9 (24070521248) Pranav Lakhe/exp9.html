<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Theme Settings</title>
	<script>
		(() => {
			const sessionTheme = sessionStorage.getItem('preferredTheme');
			const localTheme = localStorage.getItem('preferredTheme');
			const theme = sessionTheme || localTheme || 'light';

			document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
		})();
	</script>
	<style>
		:root {
			color-scheme: light;
			--page-background: #eef4f8;
			--card-background: #ffffff;
			--text-color: #16212b;
			--muted-text: #5b6b77;
			--border-color: #b8c7d1;
			--accent-color: #176b87;
			--accent-hover: #0f536a;
			--control-background: #f7fafc;
			--shadow: 0 18px 45px rgba(25, 53, 70, 0.14);
		}

		[data-theme="dark"] {
			color-scheme: dark;
			--page-background: #171c21;
			--card-background: #242c33;
			--text-color: #f1f5f7;
			--muted-text: #bdcbd3;
			--border-color: #53616b;
			--accent-color: #65c0d1;
			--accent-hover: #8bd5e1;
			--control-background: #303b43;
			--shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			position: relative;
			background: var(--page-background);
			color: var(--text-color);
			font-family: Georgia, "Times New Roman", serif;
			transition: background-color 0.3s ease, color 0.3s ease;
		}

		.student-details {
			position: absolute;
			top: 18px;
			right: 24px;
			color: var(--muted-text);
			font-family: Arial, sans-serif;
			font-size: 0.85rem;
			font-weight: 700;
			text-align: right;
		}

		.card {
			width: min(100%, 480px);
			padding: 38px;
			border: 1px solid var(--border-color);
			border-radius: 14px;
			background: var(--card-background);
			box-shadow: var(--shadow);
			text-align: center;
			transition: background-color 0.3s ease, border-color 0.3s ease;
		}

		h1 {
			margin: 0 0 10px;
			font-size: clamp(1.8rem, 5vw, 2.35rem);
			letter-spacing: 0;
		}

		.intro {
			margin: 0 0 28px;
			color: var(--muted-text);
			font-size: 0.98rem;
		}

		label {
			display: block;
			margin-bottom: 9px;
			font-weight: 700;
		}

		select,
		button {
			min-height: 44px;
			border: 1px solid var(--border-color);
			border-radius: 7px;
			font: inherit;
			cursor: pointer;
			transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
		}

		select {
			width: min(100%, 180px);
			margin-bottom: 25px;
			padding: 8px 12px;
			background: var(--control-background);
			color: var(--text-color);
		}

		.button-row {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 12px;
		}

		button {
			padding: 9px 14px;
			background: var(--accent-color);
			color: #ffffff;
			font-size: 0.9rem;
			font-weight: 700;
		}

		button:hover {
			background: var(--accent-hover);
			transform: translateY(-1px);
		}

		button.secondary {
			display: block;
			width: min(100%, 210px);
			margin: 14px auto 0;
			background: transparent;
			color: var(--text-color);
		}

		button.secondary:hover {
			background: var(--control-background);
		}

		select:hover,
		select:focus-visible,
		button:focus-visible {
			outline: 3px solid color-mix(in srgb, var(--accent-color) 45%, transparent);
			outline-offset: 3px;
		}

		select:hover {
			border-color: var(--accent-color);
		}

		#status-message {
			min-height: 1.5em;
			margin: 24px 0 0;
			color: var(--muted-text);
			font-size: 0.95rem;
			font-style: italic;
		}

		@media (max-width: 440px) {
			.card {
				padding: 28px 20px;
			}

			.button-row {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<div class="student-details">Pranav Lakhe<br>24070521248</div>
	<main class="card" aria-labelledby="page-title">
		<h1 id="page-title">Theme Settings</h1>
		<p class="intro">Choose how this page should look when you return.</p>

		<label for="theme-select">Select your preferred theme:</label>
		<select id="theme-select">
			<option value="light">Light</option>
			<option value="dark">Dark</option>
		</select>

		<div class="button-row">
			<button id="save-local" type="button">Save using localStorage</button>
			<button id="save-session" type="button">Save using sessionStorage</button>
		</div>

		<button id="clear-preferences" class="secondary" type="button">Clear Preferences</button>
		<p id="status-message" role="status" aria-live="polite"></p>
	</main>

	<script>
		const themeSelect = document.getElementById('theme-select');
		const statusMessage = document.getElementById('status-message');
		const validThemes = new Set(['light', 'dark']);

		function applyTheme(theme) {
			const selectedTheme = validThemes.has(theme) ? theme : 'light';

			document.documentElement.dataset.theme = selectedTheme;
			themeSelect.value = selectedTheme;
		}

		document.getElementById('save-local').addEventListener('click', () => {
			const theme = themeSelect.value;

			localStorage.setItem('preferredTheme', theme);
			sessionStorage.removeItem('preferredTheme');
			applyTheme(theme);
			statusMessage.textContent = 'Theme saved using localStorage.';
		});

		document.getElementById('save-session').addEventListener('click', () => {
			const theme = themeSelect.value;

			sessionStorage.setItem('preferredTheme', theme);
			localStorage.removeItem('preferredTheme');
			applyTheme(theme);
			statusMessage.textContent = 'Theme saved using sessionStorage.';
		});

		document.getElementById('clear-preferences').addEventListener('click', () => {
			localStorage.removeItem('preferredTheme');
			sessionStorage.removeItem('preferredTheme');
			applyTheme('light');
			statusMessage.textContent = 'Preferences cleared.';
		});

		const savedTheme = sessionStorage.getItem('preferredTheme') || localStorage.getItem('preferredTheme');
		applyTheme(savedTheme || 'light');

		if (savedTheme && validThemes.has(savedTheme)) {
			const storageName = sessionStorage.getItem('preferredTheme') ? 'sessionStorage' : 'localStorage';
			statusMessage.textContent = `Theme restored from ${storageName}.`;
		}
	</script>
</body>
</html>
