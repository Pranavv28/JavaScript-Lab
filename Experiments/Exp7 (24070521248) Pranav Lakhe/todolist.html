<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Task List | DOM Traversal</title>
	<style>
		:root {
			--ink: #17202a;
			--muted: #66727f;
			--paper: #fffdf8;
			--line: #e7dfd2;
			--accent: #e85d3f;
			--accent-dark: #b8422c;
			--mint: #d8eee2;
			--yellow: #f7cf6a;
			--shadow: 0 22px 60px rgba(82, 54, 29, 0.14);
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			color: var(--ink);
			font-family: Georgia, "Times New Roman", serif;
			background: #f3ede3;
			background-image: radial-gradient(#d9cbb9 0.7px, transparent 0.7px);
			background-size: 16px 16px;
		}

		.app {
			width: min(100% - 32px, 760px);
			margin: 56px auto;
			padding: clamp(24px, 5vw, 52px);
			background: var(--paper);
			border: 1px solid rgba(115, 87, 55, 0.12);
			box-shadow: var(--shadow);
		}

		.eyebrow {
			margin: 0 0 10px;
			color: var(--accent-dark);
			font: 700 0.75rem/1.2 Arial, sans-serif;
			letter-spacing: 0.14em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			max-width: 520px;
			font-size: clamp(2.5rem, 7vw, 4.8rem);
			line-height: 0.94;
			font-weight: 500;
		}

		.intro {
			margin: 22px 0 34px;
			color: var(--muted);
			font: 1rem/1.6 Arial, sans-serif;
		}

		.add-form {
			display: flex;
			gap: 10px;
			margin-bottom: 30px;
		}

		input {
			min-width: 0;
			flex: 1;
			padding: 15px 16px;
			color: var(--ink);
			font: 1rem Arial, sans-serif;
			border: 1px solid var(--line);
			border-radius: 3px;
			background: #fff;
			outline: none;
		}

		input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232, 93, 63, 0.14); }

		button {
			border: 0;
			border-radius: 3px;
			cursor: pointer;
			font: 700 0.82rem Arial, sans-serif;
		}

		.add-button {
			padding: 0 21px;
			color: #fff;
			background: var(--accent);
		}

		.add-button:hover { background: var(--accent-dark); }

		.list-header {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			padding-bottom: 12px;
			border-bottom: 2px solid var(--ink);
		}

		.list-header h2 { margin: 0; font-size: 1.25rem; font-weight: 500; }
		#task-count { color: var(--muted); font: 0.78rem Arial, sans-serif; }

		#task-list { margin: 0; padding: 0; list-style: none; }

		.task {
			display: flex;
			align-items: center;
			gap: 14px;
			padding: 17px 0;
			border-bottom: 1px solid var(--line);
			animation: appear 240ms ease-out both;
		}

		.task-check {
			width: 19px;
			height: 19px;
			flex: 0 0 19px;
			border: 2px solid var(--accent);
			border-radius: 50%;
			background: transparent;
		}

		.task-check.done { border-color: #6a9b7e; background: var(--mint); }
		.task-check.done::after { display: block; content: "✓"; margin: -4px 0 0 2px; color: #3b7354; font: 700 0.9rem Arial, sans-serif; }

		.task-text {
			min-width: 0;
			flex: 1;
			overflow-wrap: anywhere;
			font-size: 1.1rem;
		}

		.task.completed .task-text { color: var(--muted); text-decoration: line-through; }

		.task-actions { display: flex; gap: 7px; }
		.task-actions button { padding: 8px 10px; color: var(--muted); background: #f4efe6; }
		.task-actions button:hover { color: var(--ink); background: var(--yellow); }
		.task-actions .delete:hover { color: #fff; background: var(--accent); }
		.status-select { padding: 8px 5px; color: var(--muted); border: 0; border-radius: 3px; background: #f4efe6; font: 700 0.75rem Arial, sans-serif; }
		.status-select:focus { outline: 2px solid var(--accent); }
		.task-section { margin-top: 25px; }
		.task-section h3 { margin: 0; color: var(--muted); font: 700 0.75rem Arial, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; }
		.task-section ul { margin: 0; padding: 0; list-style: none; }
		.section-empty { padding: 12px 0 0; color: var(--muted); font: italic 0.9rem Arial, sans-serif; }

		#empty-state { padding: 30px 0 10px; color: var(--muted); font-style: italic; text-align: center; }

		@keyframes appear { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

		@media (max-width: 520px) {
			.app { width: min(100% - 20px, 760px); margin: 20px auto; padding: 25px 20px; }
			.add-form { flex-direction: column; }
			.add-button { min-height: 46px; }
			.task { align-items: flex-start; }
			.task-actions { flex-direction: column; }
		}
	</style>
</head>
<body>
	<main class="app">
		<p class="eyebrow">DOM traversal / experiment 07</p>
		<h1>Small steps, clearly listed.</h1>
		<p class="intro">PRANAV LAKHE 24070521248</p>

		<form class="add-form" id="task-form">
			<input id="task-input" type="text" placeholder="What needs doing?" autocomplete="off" aria-label="New task">
			<button class="add-button" type="submit">Add task</button>
		</form>

		<section aria-labelledby="list-title">
			<div class="list-header">
				<h2 id="list-title">Your list</h2>
				<span id="task-count">0 tasks</span>
			</div>
			<div class="task-section" data-status="pending">
				<h3>Pending</h3>
				<ul id="pending-list"></ul>
				<p class="section-empty">Nothing waiting.</p>
			</div>
			<div class="task-section" data-status="in-progress">
				<h3>In progress</h3>
				<ul id="in-progress-list"></ul>
				<p class="section-empty">Nothing underway.</p>
			</div>
			<div class="task-section" data-status="completed">
				<h3>Completed</h3>
				<ul id="completed-list"></ul>
				<p class="section-empty">Nothing finished.</p>
			</div>
		</section>
	</main>

	<script>
		const form = document.querySelector("#task-form");
		const input = document.querySelector("#task-input");
		const taskSections = document.querySelectorAll(".task-section");
		const taskCount = document.querySelector("#task-count");

		function updateSummary() {
			const tasks = document.querySelectorAll(".task");
			taskCount.textContent = `${tasks.length} ${tasks.length === 1 ? "task" : "tasks"}`;
			taskSections.forEach((section) => {
				section.querySelector(".section-empty").hidden = section.querySelectorAll(".task").length > 0;
			});
		}

		function createTask(text) {
			const task = document.createElement("li");
			task.className = "task";
			task.innerHTML = `
				<span class="task-check" aria-hidden="true"></span>
				<span class="task-text"></span>
				<span class="task-actions">
					<select class="status-select" aria-label="Task status">
						<option value="pending">Pending</option>
						<option value="in-progress">In progress</option>
						<option value="completed">Completed</option>
					</select>
					<button class="edit" type="button">Edit</button>
					<button class="delete" type="button">Delete</button>
				</span>`;
			task.querySelector(".task-text").textContent = text;
			document.querySelector("#pending-list").append(task);
			updateSummary();
		}

		form.addEventListener("submit", (event) => {
			event.preventDefault();
			const text = input.value.trim();
			if (!text) return;
			createTask(text);
			input.value = "";
			input.focus();
		});

		document.querySelector("section[aria-labelledby='list-title']").addEventListener("click", (event) => {
			const action = event.target.closest("button");
			const task = event.target.closest(".task");
			if (!action || !task) return;

			if (action.classList.contains("delete")) {
				task.remove();
			} else if (action.classList.contains("edit")) {
				const taskText = task.querySelector(".task-text");
				const revisedText = window.prompt("Edit task", taskText.textContent);
				if (revisedText !== null && revisedText.trim()) taskText.textContent = revisedText.trim();
			}
			updateSummary();
		});

		document.querySelector("section[aria-labelledby='list-title']").addEventListener("change", (event) => {
			if (!event.target.classList.contains("status-select")) return;
			const task = event.target.closest(".task");
			const destination = document.querySelector(`#${event.target.value}-list`);
			task.classList.toggle("completed", event.target.value === "completed");
			destination.append(task);
			updateSummary();
		});

		updateSummary();
	</script>
</body>
</html>
